name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        shell: bash
        run: |
          node --test \
            --experimental-test-coverage \
            --test-reporter=lcov \
            --test-reporter-destination=coverage.lcov \
            --experimental-strip-types \
            src/lib/native/consent.test.ts \
            src/lib/time/provider.test.ts \
            tests/https-guard-host-validation.test.mjs \
            tests/check-headers.test.mjs \
            tests/pre-hydration-hash.test.mjs \
            tests/error-page-clickjacking.test.mjs

      - name: Convert LCOV to Cobertura
        shell: bash
        run: |
          pip install --quiet lcov_cobertura
          python3 -m lcov_cobertura coverage.lcov --output coverage.xml

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report-typescript
          path: coverage.xml

  upload-coverage-typescript:
    name: Upload coverage to GitHub
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-report-typescript

      - uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1
        with:
          file: coverage.xml
          language: TypeScript
          label: code-coverage-agent
