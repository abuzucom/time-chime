name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        shell: bash
        run: |
          node --test \
            --experimental-test-coverage \
            --test-reporter=lcov \
            --test-reporter-destination=coverage.lcov \
            --experimental-strip-types \
            src/lib/native/consent.test.ts \
            src/lib/time/provider.test.ts \
            tests/https-guard-host-validation.test.mjs \
            tests/https-guard-fuzz.test.mjs \
            tests/check-headers.test.mjs \
            tests/pre-hydration-hash.test.mjs \
            tests/error-page-clickjacking.test.mjs \
            tests/clickjacking-defences.test.mjs \
            tests/trusted-gh.test.mjs \
            tests/security-headers-e2e.test.mjs

      - name: Convert LCOV to Cobertura
        shell: bash
        run: |
          pip install --quiet lcov_cobertura
          python3 -m lcov_cobertura coverage.lcov --output coverage.xml

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-typescript
          path: coverage.xml

  upload-coverage-typescript:
    name: Upload coverage to GitHub
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report-typescript

      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage.xml
          language: TypeScript
          label: code-coverage-agent
